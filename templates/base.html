<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ef"><meta name="description" content="A calm, focused way to learn Latin vocabulary."><title>{% block title %}Long Live Latin{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css',v=config.ASSET_VERSION)}}"></head><body class="{% block body_class %}{% endblock %}">
<header class="site-header"><a class="brand" href="/" aria-label="Long Live Latin home"><span class="brand-word">LONG LIVE LAT</span><svg class="brand-column" viewBox="0 0 24 64" aria-hidden="true" focusable="false"><rect x="1" y="1" width="22" height="3"/><rect x="4" y="5.5" width="16" height="2.5"/><rect x="9" y="9" width="1.6" height="46"/><rect x="11.2" y="9" width="1.6" height="46"/><rect x="13.4" y="9" width="1.6" height="46"/><rect x="4" y="56" width="16" height="2.5"/><rect x="0.5" y="59.5" width="23" height="3"/></svg><span class="brand-word">N</span></a>{% block header %}{% endblock %}</header>
{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="wrap notices">{% for kind,msg in messages %}<p class="notice {{kind}}">{{msg}}</p>{% endfor %}</div>{% endif %}{% endwith %}
<main>{% block content %}{% endblock %}</main><footer><span>Long Live Latin · Disce cotidie.</span><div class="footer-links"><button class="footer-link refresh-app" type="button" data-refresh-app>Refresh site</button><a class="footer-link" href="/admin">Administration</a></div></footer><script src="{{url_for('static',filename='app.js',v=config.ASSET_VERSION)}}" defer></script></body></html>
