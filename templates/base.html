<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ef"><meta name="description" content="A calm, focused way to learn Latin vocabulary."><title>{% block title %}Long Live Latin{% endblock %}</title><link rel="stylesheet" href="/static/style.css"></head><body class="{% block body_class %}{% endblock %}">
<header class="site-header"><a class="brand" href="/" aria-label="Long Live Latin home"><span>LONG LIVE</span><strong>LATIN</strong></a>{% block header %}{% endblock %}</header>
{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="wrap notices">{% for kind,msg in messages %}<p class="notice {{kind}}">{{msg}}</p>{% endfor %}</div>{% endif %}{% endwith %}
<main>{% block content %}{% endblock %}</main><footer><span>Disce cotidie.</span><a href="/admin">Administration</a></footer><script src="/static/app.js" defer></script></body></html>
